# Weekly bumps: routine updates grouped per ecosystem; major updates (including 0.x
# minor bumps, which are breaking in Cargo) as individual PRs.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      cargo:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: docker
    # The launcher image and the guest base image.
    directories: ["/", "/guest/rootfs"]
    schedule:
      interval: weekly
    groups:
      docker:
        patterns: ["*"]
