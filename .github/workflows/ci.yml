name: ci

# Pull requests (including forks) run with a read-only token on GitHub-hosted
# runners only. Nothing here is privileged.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  fmt:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal --component rustfmt && rustup default stable
      - run: cargo fmt --all --check

  deny:
    # Advisories (RustSec), yanked crates, licenses and sources; see deny.toml.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          tool: cargo-deny@0.20.2
      - run: cargo deny --locked check

  clippy:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal --component clippy && rustup default stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal && rustup default stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo test --workspace --locked

  build:
    uses: ./.github/workflows/build.yml

  image:
    needs: [build]
    uses: ./.github/workflows/image.yml
    with:
      push: false
      artifact: true

  # Real VMs on GitHub-hosted runners: ephemeral VMs with /dev/kvm and no secrets, so
  # pull requests run here too. Every test marked #[ignore] (the ones that need
  # /dev/kvm) runs inside the image built above, so it tests the shipped QEMU.
  kvm:
    needs: [build, image]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Enable /dev/kvm
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          # trigger is asynchronous; without settle the check below can race it.
          sudo udevadm settle
          ls -l /dev/kvm || { echo "::error::This runner has no /dev/kvm"; exit 1; }
          test -w /dev/kvm || { echo "::error::/dev/kvm is not writable after the udev rule"; exit 1; }
      - run: grep -m1 'model name' /proc/cpuinfo
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image-amd64
          path: artifacts
      - run: zstd -dc artifacts/image-amd64.tar.zst | docker load
      - name: Start the shipped QEMU on KVM
        run: |
          printf '%s\n' '{"execute":"qmp_capabilities"}' '{"execute":"quit"}' |
            docker run --rm -i --device /dev/kvm --entrypoint qemu-system-x86_64 savestate:smoke \
              -accel kvm -machine pc-q35-11.1 -nodefaults -display none -S -qmp stdio

      # Static musl test binaries run in the image whatever its libc.
      - run: |
          rustup toolchain install stable --profile minimal --target x86_64-unknown-linux-musl && rustup default stable
          sudo apt-get update -qq && sudo apt-get install -y -qq musl-tools
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: kvm-musl
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build the tests
        env:
          CARGO_PROFILE_DEV_DEBUG: "0"
        run: |
          cargo test --workspace --locked --target x86_64-unknown-linux-musl --no-run --message-format=json |
            jq -r 'select(.profile.test == true and .executable != null) | .executable' >tests.txt
          cat tests.txt
      - name: Run the ignored tests in the image
        run: |
          docker run --rm --privileged -v "$PWD:$PWD" -w "$PWD" --entrypoint sh savestate:smoke -c \
            'for t in "$@"; do "$t" --ignored --test-threads=1 --nocapture || exit 1; done' sh $(cat tests.txt)

  # Single required status check for branch rules and auto-merge.
  ci-ok:
    if: always()
    needs: [fmt, deny, clippy, test, build, image, kvm]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: All CI jobs succeeded
        run: test "$RESULTS" = "success"
        env:
          RESULTS: ${{ join(needs.*.result, ' ') == 'success success success success success success success' && 'success' || 'failure' }}
