name: ci

# Pull requests (including forks) run with a read-only token on GitHub-hosted
# runners only. Nothing here is privileged.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  fmt:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # rust-toolchain.toml pins the version, components and targets.
      - run: rustup toolchain install
      - run: cargo fmt --all --check

  deny:
    # Advisories (RustSec), yanked crates, licenses and sources; see deny.toml.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@a4d3f3f761dcd95cce1b72cb61cb6d1963438177 # v2.87.30
        with:
          tool: cargo-deny@0.20.2
      - run: cargo deny --locked check

  clippy:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo test --workspace --locked
      - name: deploy/crds is what `savestate crds` generates
        run: |
          cargo run -q -p savestate --locked -- crds >"$RUNNER_TEMP/crds.yaml"
          diff -u deploy/crds/savestate.dev.yaml "$RUNNER_TEMP/crds.yaml" || {
            echo "::error::deploy/crds/savestate.dev.yaml is stale: cargo run -p savestate -- crds > deploy/crds/savestate.dev.yaml"
            exit 1
          }

  # The CRDs, the install manifests and the controller on a real cluster (kind), on
  # the oldest and the newest Kubernetes savestate supports (docs/design.md). These
  # tests are #[ignore]d locally because they need a cluster.
  api:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node:
          - kindest/node:v1.32.11@sha256:5fc52d52a7b9574015299724bd68f183702956aa4a2116ae75a63cb574b35af8
          - kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: api
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo test --locked -p savestate-api --test apiserver -p savestate --test controller --no-run
      - name: Start a kind cluster
        run: |
          curl -fsSLo kind https://github.com/kubernetes-sigs/kind/releases/download/v0.33.0/kind-linux-amd64
          echo "aee6151561422756b764a4ae28e7f44cda5af5a9eead3cc9985112b1de8d8e0d  kind" | sha256sum -c
          sudo install kind /usr/local/bin/kind
          kind create cluster --image "${{ matrix.node }}" --wait 2m
      - name: The kustomize base applies
        run: kubectl apply -k deploy/base
      - run: cargo test --locked -p savestate-api --test apiserver -- --ignored
      # The VM pods in the controller test run a dummy launcher, pinned by digest
      # like a real one: load it into the node and name it by its digest there.
      - name: Load the dummy launcher image
        run: |
          docker build -t savestate-test/launcher:dummy crates/savestate/tests/launcher
          kind load docker-image savestate-test/launcher:dummy
          ref=docker.io/savestate-test/launcher:dummy
          digest=$(docker exec kind-control-plane ctr -n k8s.io images ls "name==$ref" | awk 'NR == 2 {print $3}')
          docker exec kind-control-plane ctr -n k8s.io images tag "$ref" "docker.io/savestate-test/launcher@$digest"
          echo "SAVESTATE_TEST_LAUNCHER_IMAGE=docker.io/savestate-test/launcher@$digest" >>"$GITHUB_ENV"
      # No node agent runs here: advertise its VM slots on the node and install the
      # VM pods' seccomp profile the way it would.
      - name: Stand in for the node agent's device plugin and seccomp profile
        run: |
          kubectl patch node kind-control-plane --subresource=status --type=json \
            -p '[{"op": "add", "path": "/status/capacity/savestate.dev~1vm", "value": "8"}]'
          docker exec kind-control-plane mkdir -p /var/lib/kubelet/seccomp/savestate
          docker cp crates/savestate/src/node/vm-seccomp.json kind-control-plane:/var/lib/kubelet/seccomp/savestate/vm.json
      - run: cargo test --locked -p savestate --test controller -- --ignored --nocapture

  # The object-store client (crates/savestate-objstore) against a real S3-compatible
  # store: MinIO, from a community build (upstream publishes no images any more).
  objstore:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: objstore
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo test --locked -p savestate-objstore --test minio --no-run
      - name: Start MinIO with a bucket
        run: |
          docker run -d --name minio -p 127.0.0.1:9000:9000 \
            -e MINIO_ROOT_USER=savestate -e MINIO_ROOT_PASSWORD=savestate-test \
            pgsty/minio:RELEASE.2026-08-04T00-00-00Z@sha256:b6bfe7239bfc83fb90d31612d9704d86039dd714f7904b3f1ad68f211e602372 \
            server /data
          for _ in $(seq 60); do curl -fs http://127.0.0.1:9000/minio/health/live && break; sleep 1; done
          curl -fsS --aws-sigv4 aws:amz:us-east-1:s3 --user savestate:savestate-test -X PUT http://127.0.0.1:9000/savestate
      - run: cargo test --locked -p savestate-objstore --test minio -- --ignored --nocapture
        env:
          SAVESTATE_TEST_S3_ENDPOINT: http://127.0.0.1:9000
          SAVESTATE_TEST_S3_BUCKET: savestate
          SAVESTATE_TEST_S3_REGION: us-east-1
          SAVESTATE_TEST_S3_ACCESS_KEY_ID: savestate
          SAVESTATE_TEST_S3_SECRET_ACCESS_KEY: savestate-test

  build:
    uses: ./.github/workflows/build.yml

  image:
    needs: [build, guest-kernel]
    uses: ./.github/workflows/image.yml
    with:
      push: false
      artifact: true

  # The guest kernel (orbd's, plus guest/kernel/savestate.config), shipped in the
  # launcher image.
  guest-kernel:
    uses: ./.github/workflows/guest-kernel.yml

  # The generic guest base image (guest/rootfs) with this commit's guest agent, cached
  # on its inputs.
  guest-rootfs:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: guest-rootfs/rootfs.qcow2
          key: guest-rootfs-${{ hashFiles('guest/rootfs/**', 'crates/savestate-guest/**', 'crates/savestate-guest-proto/**', 'proto/**', 'Cargo.toml', 'Cargo.lock', 'rust-toolchain.toml') }}
      - if: steps.cache.outputs.cache-hit != 'true'
        name: Build the guest agent and the image
        run: |
          rustup toolchain install
          sudo apt-get update -qq && sudo apt-get install -y -qq musl-tools
          cargo build --locked --release --target x86_64-unknown-linux-musl -p savestate-guest
          guest/rootfs/build.sh disk target/x86_64-unknown-linux-musl/release/savestate-guest guest-rootfs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: guest-rootfs
          path: guest-rootfs/rootfs.qcow2
          if-no-files-found: error
          compression-level: 1
          retention-days: 3

  # Real VMs on GitHub-hosted runners: ephemeral VMs with /dev/kvm and no secrets, so
  # pull requests run here too. Every test marked #[ignore] (the ones that need
  # /dev/kvm; not the cluster tests, which the api job runs) runs inside the image
  # built above, so it tests the shipped QEMU, with the guest kernel and base image
  # built above.
  kvm:
    needs: [build, image, guest-kernel, guest-rootfs]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Enable /dev/kvm
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          # trigger is asynchronous; without settle the check below can race it.
          sudo udevadm settle
          ls -l /dev/kvm || { echo "::error::This runner has no /dev/kvm"; exit 1; }
          test -w /dev/kvm || { echo "::error::/dev/kvm is not writable after the udev rule"; exit 1; }
      # The guest agent's channel (QEMU's vhost-vsock-pci).
      - run: sudo modprobe vhost_vsock && ls -l /dev/vhost-vsock
      - run: grep -m1 'model name' /proc/cpuinfo
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: "{image-amd64,guest-kernel,guest-rootfs}"
          path: artifacts
      - run: zstd -dc artifacts/image-amd64/image-amd64.tar.zst | docker load
      - name: Start the shipped QEMU on KVM
        run: |
          printf '%s\n' '{"execute":"qmp_capabilities"}' '{"execute":"quit"}' |
            docker run --rm -i --device /dev/kvm --entrypoint qemu-system-x86_64 savestate:smoke \
              -accel kvm -machine pc-q35-11.1 -nodefaults -display none -S -qmp stdio

      # Static musl test binaries run in the image whatever its libc.
      - run: |
          rustup toolchain install
          sudo apt-get update -qq && sudo apt-get install -y -qq musl-tools
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: kvm-musl
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build the tests
        env:
          CARGO_PROFILE_DEV_DEBUG: "0"
        run: |
          cargo test --workspace --locked --target x86_64-unknown-linux-musl --no-run --message-format=json |
            jq -r 'select(.profile.test == true and .executable != null and (.target.name | IN("apiserver", "controller", "e2e", "minio") | not)) | .executable' >tests.txt
          cat tests.txt
      - name: Run the ignored tests in the image
        run: |
          docker run --rm --privileged -v "$PWD:$PWD" -w "$PWD" \
            -e "SAVESTATE_TEST_KERNEL=$PWD/artifacts/guest-kernel/bzImage" \
            -e "SAVESTATE_TEST_ROOTFS=$PWD/artifacts/guest-rootfs/rootfs.qcow2" \
            --entrypoint sh savestate:smoke -c \
            'for t in "$@"; do "$t" --ignored --test-threads=1 --nocapture || exit 1; done' sh $(cat tests.txt)

  # The whole of savestate on KVM: kind on a KVM runner with the image built above
  # installed from deploy/, a base image made from the guest rootfs built above, and
  # tests/e2e.rs driving the CLI (boot, checkpoint while running, concurrent restores
  # with frozen and stepped clocks, fork of a restored sandbox; export to MinIO, the
  # local copy dropped, restore from the store), then garbage collection on the node
  # and in the store once everything is deleted.
  e2e:
    needs: [build, image, guest-rootfs]
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Enable /dev/kvm and /dev/vhost-vsock
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo udevadm settle
          sudo modprobe vhost_vsock
          ls -l /dev/kvm /dev/vhost-vsock /dev/net/tun
      - run: grep -m1 'model name' /proc/cpuinfo
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: "{image-amd64,guest-rootfs}"
          path: artifacts
      - run: zstd -dc artifacts/image-amd64/image-amd64.tar.zst | docker load
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: e2e
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo test --locked -p savestate --test e2e --no-run
      - name: Set up kind, a registry and savestate
        env:
          KIND_NODE_IMAGE: kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5
        run: |
          curl -fsSLo kind https://github.com/kubernetes-sigs/kind/releases/download/v0.33.0/kind-linux-amd64
          echo "aee6151561422756b764a4ae28e7f44cda5af5a9eead3cc9985112b1de8d8e0d  kind" | sha256sum -c
          sudo install kind /usr/local/bin/kind
          crates/savestate/tests/e2e/setup.sh savestate:smoke artifacts/guest-rootfs/rootfs.qcow2 "$RUNNER_TEMP/e2e.env"
          cat "$RUNNER_TEMP/e2e.env" >>"$GITHUB_ENV"
      - name: End to end
        env:
          SAVESTATE_E2E_REPORT: ${{ runner.temp }}/e2e-report.txt
        # One scenario at a time: the node has room for three VMs.
        run: cargo test --locked -p savestate --test e2e -- --ignored --nocapture --test-threads=1
      - name: Garbage collection removes everything once the objects are gone
        run: |
          node=savestate-control-plane
          store() {
            curl -fsS --aws-sigv4 aws:amz:us-east-1:s3 --user "$SAVESTATE_E2E_S3_ACCESS_KEY_ID:$SAVESTATE_E2E_S3_SECRET_ACCESS_KEY" \
              "$SAVESTATE_E2E_S3_ENDPOINT/$SAVESTATE_E2E_S3_BUCKET?list-type=2&prefix=$SAVESTATE_E2E_S3_PREFIX/"
          }
          for _ in $(seq 60); do
            left=$(docker exec "$node" sh -c 'ls /var/lib/savestate/images /var/lib/savestate/layers /var/lib/savestate/checkpoints; ls /run/savestate/sandboxes 2>/dev/null' | grep -v ':$' | grep -vc '^$' || true)
            objects=$(store | grep -o '<Key>' | wc -l)
            pinned=$(kubectl get node "$node" -o jsonpath='{.metadata.annotations.cluster-autoscaler\.kubernetes\.io/scale-down-disabled}')
            if [ "$left" = 0 ] && [ "$objects" = 0 ] && [ -z "$pinned" ]; then
              echo "state directory, run directories and store are empty; the node may be scaled down"
              exit 0
            fi
            sleep 5
          done
          docker exec "$node" sh -c 'ls -lR /var/lib/savestate /run/savestate'
          store
          echo "scale-down-disabled: $pinned"
          exit 1
      - name: Results
        if: always()
        run: |
          {
            echo '## End to end'
            echo
            echo "Host CPU: $(grep -m1 'model name' /proc/cpuinfo | cut -d: -f2), guest CPU model \`${SAVESTATE_E2E_CPU_MODEL:-}\`"
            echo
            echo '```'
            cat "$RUNNER_TEMP/e2e-report.txt" 2>/dev/null || true
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"
      - name: Cluster state
        if: failure()
        run: |
          kubectl get pods,sandboxes,checkpoints,transfers -A -o wide || true
          kubectl get events -A --sort-by=.lastTimestamp || true
          kubectl -n savestate-system logs -l app.kubernetes.io/component=controller --tail=-1 || true
          kubectl -n savestate-system logs -l app.kubernetes.io/component=node --all-containers --tail=-1 || true
          for pod in $(kubectl -n sandboxes get pods -o name); do
            echo "--- $pod"; kubectl -n sandboxes logs "$pod" --tail=300 || true
          done

  # Single required status check for branch rules and auto-merge.
  ci-ok:
    if: always()
    needs: [fmt, deny, clippy, test, api, objstore, build, image, guest-kernel, guest-rootfs, kvm, e2e]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: All CI jobs succeeded
        run: test "$RESULTS" = "success"
        env:
          RESULTS: ${{ join(needs.*.result, ' ') == 'success success success success success success success success success success success success' && 'success' || 'failure' }}
