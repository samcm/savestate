# The guest kernel (orbd's guest config, plus guest/kernel/savestate.config), uploaded
# as artifact guest-kernel. ~10 min to build, so cached on its inputs. Shared by
# ci.yml, publish.yml and release.yml: the launcher image ships it.
name: guest-kernel

on:
  workflow_call:

permissions:
  contents: read

jobs:
  guest-kernel:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: orbd
        run: echo "rev=$(guest/kernel/orbd-rev.sh)" >>"$GITHUB_OUTPUT"
      - id: cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            guest-kernel/bzImage
            guest-kernel/manifest.txt
          key: guest-kernel-${{ steps.orbd.outputs.rev }}-${{ hashFiles('guest/kernel/**') }}
      - if: steps.cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq flex bison bc libelf-dev libssl-dev
          guest/kernel/build.sh guest-kernel
      - run: cat guest-kernel/manifest.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: guest-kernel
          path: guest-kernel/bzImage
          if-no-files-found: error
          retention-days: 3
