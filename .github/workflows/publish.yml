# Pushes ghcr.io/samcm/savestate:main and :sha-<short> for every push to main.
name: publish

on:
  push:
    branches: [main]

permissions:
  contents: read

# The newest main commit wins; a push in progress is not cancelled.
concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  build:
    uses: ./.github/workflows/build.yml

  guest-kernel:
    uses: ./.github/workflows/guest-kernel.yml

  image:
    needs: [build, guest-kernel]
    uses: ./.github/workflows/image.yml
    permissions:
      contents: read
      packages: write
    with:
      push: true
