[workspace]
resolver = "3"
members = ["crates/savestate", "crates/savestate-api"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/samcm/savestate"
# Matches rust-toolchain.toml; the pinned toolchain is the only one we build with.
rust-version = "1.99"
publish = false

# Every crate opts in with `[lints] workspace = true`. CI denies warnings.
[workspace.lints.rust]
# Allow per item only, with a `// SAFETY:` comment on each unsafe block.
unsafe_code = "deny"
rust_2018_idioms = { level = "warn", priority = -1 }
unused_qualifications = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Pedantic lints that are noise here: errors and panics are documented where they
# are surprising, not on every function, and `#[must_use]` goes where ignoring a
# value is a bug.
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
# Not left behind in committed code.
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
# Daemons log through `tracing`. CLI output is written to a locked `io::stdout()`,
# which reports a closed pipe as an error where `println!` panics.
print_stdout = "warn"
print_stderr = "warn"
# Tests may unwrap and expect (clippy.toml); other code handles or propagates errors.
unwrap_used = "warn"
expect_used = "warn"

[workspace.dependencies]
savestate-api = { path = "crates/savestate-api" }

anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
ipnet = { version = "2", features = ["serde"] }
k8s-openapi = { version = "0.28", features = ["v1_36", "schemars"] }
kube = { version = "4.2", default-features = false }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde-saphyr = "0.0.29" # the version kube-client uses, so the binary has one YAML library
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
