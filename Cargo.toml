[workspace]
resolver = "3"
members = [
    "crates/savestate",
    "crates/savestate-api",
    "crates/savestate-guest",
    "crates/savestate-guest-proto",
    "crates/savestate-objstore",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/samcm/savestate"
# Matches rust-toolchain.toml; the pinned toolchain is the only one we build with.
rust-version = "1.99"
publish = false

# Every crate opts in with `[lints] workspace = true`. CI denies warnings.
[workspace.lints.rust]
# Allow per item only, with a `// SAFETY:` comment on each unsafe block.
unsafe_code = "deny"
rust_2018_idioms = { level = "warn", priority = -1 }
unused_qualifications = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Pedantic lints that are noise here: errors and panics are documented where they
# are surprising, not on every function, and `#[must_use]` goes where ignoring a
# value is a bug.
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
# Not left behind in committed code.
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
# Daemons log through `tracing`. CLI output is written to a locked `io::stdout()`,
# which reports a closed pipe as an error where `println!` panics.
print_stdout = "warn"
print_stderr = "warn"
# Tests may unwrap and expect (clippy.toml); other code handles or propagates errors.
unwrap_used = "warn"
expect_used = "warn"

[workspace.dependencies]
savestate-api = { path = "crates/savestate-api" }
savestate-guest-proto = { path = "crates/savestate-guest-proto", default-features = false }
savestate-objstore = { path = "crates/savestate-objstore" }

# orbd's shared QEMU and guest-agent crates, pinned to one revision.
orbd-guest = { git = "https://github.com/samcm/orbd", rev = "9151e285608ea706aed22be8804776a972a82afe" }
orbd-qemu = { git = "https://github.com/samcm/orbd", rev = "9151e285608ea706aed22be8804776a972a82afe" }
orbd-vm = { git = "https://github.com/samcm/orbd", rev = "9151e285608ea706aed22be8804776a972a82afe" }

anyhow = "1"
base64 = "0.23"
bytes = "1"
fail = "0.5"
flate2 = "1"
hyper-util = { version = "0.1", features = ["tokio"] }
nftables = "0.6"
oci-client = { version = "0.18", default-features = false, features = ["rustls-tls-no-provider"] }
rand = "0.10"
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
rtnetlink = "0.23"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
sha2 = "0.11"
tar = { version = "0.4", default-features = false }
tokio-stream = { version = "0.1", features = ["net"] }
tokio-util = { version = "0.7", features = ["io-util"] }
tonic = { version = "0.14", default-features = false, features = ["transport", "codegen", "router"] }
tonic-prost = "0.14"
tonic-prost-build = "0.14"
tower = "0.5"
clap = { version = "4", features = ["derive", "env"] }
futures = "0.3"
hex = "0.4"
ipnet = { version = "2", features = ["serde"] }
jiff = "0.2"
k8s-openapi = { version = "0.28", features = ["v1_36", "schemars"] }
kube = { version = "4.2", default-features = false }
kube_quantity = "0.9"
libc = "0.2"
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.18", default-features = false, features = ["http-listener"] }
nix = { version = "0.31", features = ["fs", "time"] }
# S3 only, signing with ring like the rest of the binary (no aws-lc-rs).
object_store = { version = "0.14", default-features = false, features = ["aws-base", "reqwest", "ring"] }
prost = "0.14"
prost-build = "0.14"
protoc-bin-vendored = "3"
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde-saphyr = { version = "2", default-features = false, features = ["serialize", "deserialize"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tokio-vsock = "0.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
