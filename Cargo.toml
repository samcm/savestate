[workspace]
resolver = "3"
members = ["crates/savestate", "crates/savestate-api"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/samcm/savestate"
rust-version = "1.90"
publish = false

[workspace.dependencies]
savestate-api = { path = "crates/savestate-api" }

anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
ipnet = { version = "2", features = ["serde"] }
k8s-openapi = { version = "0.28", features = ["v1_36", "schemars"] }
kube = { version = "4.2", default-features = false }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde-saphyr = "0.0.29" # the version kube-client uses, so the binary has one YAML library
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
