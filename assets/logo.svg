<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="savestate">
  <defs>
    <radialGradient id="orb" cx="0.36" cy="0.32" r="0.75">
      <stop offset="0" stop-color="#a5b4fc"/>
      <stop offset="0.45" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#3730a3"/>
    </radialGradient>
    <!-- save slot: rounded square with the floppy's clipped corner -->
    <path id="slot" d="M4 0H31L40 9V36A4 4 0 0 1 36 40H4A4 4 0 0 1 0 36V4A4 4 0 0 1 4 0Z"/>
    <!-- each copy is cut back from the card in front of it, leaving a clear gap -->
    <mask id="behind1" maskUnits="userSpaceOnUse" x="0" y="0" width="64" height="64">
      <rect width="64" height="64" fill="#fff"/>
      <use href="#slot" transform="translate(12 12)" stroke="#000" stroke-width="4" stroke-linejoin="round"/>
    </mask>
    <mask id="behind0" maskUnits="userSpaceOnUse" x="0" y="0" width="64" height="64">
      <rect width="64" height="64" fill="#fff"/>
      <use href="#slot" transform="translate(6 18)" stroke="#000" stroke-width="4" stroke-linejoin="round"/>
    </mask>
  </defs>
  <!-- copies of the same moment -->
  <g mask="url(#behind1)"><use href="#slot" transform="translate(18 6)" fill="#cbd5e1"/></g>
  <g mask="url(#behind0)"><use href="#slot" transform="translate(12 12)" fill="#94a3b8"/></g>
  <!-- the saved state -->
  <g transform="translate(6 18)">
    <use href="#slot" fill="#64748b"/>
    <path d="M9 0H27V9A2 2 0 0 1 25 11H11A2 2 0 0 1 9 9Z" fill="#334155"/>
    <circle cx="33" cy="12.5" r="2.5" fill="#4ade80"/>
    <rect x="5" y="17" width="30" height="19" rx="2" fill="#cbd5e1"/>
    <circle cx="20" cy="26.5" r="8" fill="url(#orb)"/>
    <ellipse cx="17.2" cy="23.2" rx="2.5" ry="1.6" fill="#fff" fill-opacity="0.55" transform="rotate(-30 17.2 23.2)"/>
  </g>
</svg>
