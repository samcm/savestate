[package]
name = "savestate-objstore"
description = "Checkpoint export to and import from S3-compatible object stores, and their garbage collection"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
bytes.workspace = true
futures.workspace = true
hex.workspace = true
nix = { workspace = true, features = ["fs"] }
object_store.workspace = true
# TLS for object_store's HTTP client, with the process's rustls provider (ring).
reqwest.workspace = true
rustls.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["fs", "rt", "sync", "time"] }
tracing.workspace = true

[dev-dependencies]
rand.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
