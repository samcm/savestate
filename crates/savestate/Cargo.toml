[package]
name = "savestate"
description = "QEMU/KVM sandboxes on Kubernetes with checkpoints: controller, node agent, launcher and CLI"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
anyhow.workspace = true
clap.workspace = true
futures.workspace = true
jiff.workspace = true
k8s-openapi.workspace = true
kube = { workspace = true, features = ["client", "runtime", "rustls-tls", "ring"] }
kube_quantity.workspace = true
metrics.workspace = true
metrics-exporter-prometheus.workspace = true
savestate-api.workspace = true
serde.workspace = true
serde-saphyr.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["signal", "time"] }
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
kube = { workspace = true, features = ["ws"] }
