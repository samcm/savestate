# savestate installation config, read by the controller and the node agents.
# Every value below is an example: replace it with your installation's own (see
# deploy/README.md). Commented-out fields show their defaults.

# Namespaces whose sandboxes savestate runs (required). VM pods run in their
# sandbox's namespace; bind the controller and node-agent roles in each (see
# sandboxes.yaml). Objects in other namespaces are ignored.
namespaces: [sandboxes]

# Directory on every VM node for images, layers and checkpoints. It must match
# the node agent's hostPath in node.yaml.
# stateDir: /var/lib/savestate

# The kubelet's root directory on every VM node: the node agent serves its device
# plugin in device-plugins/ and installs the VM pods' seccomp profile in seccomp/
# below it. It must match the node agent's hostPaths in node.yaml.
# kubeletDir: /var/lib/kubelet

# Image VM pods run, pinned by digest. Default: the controller's own image.
# launcherImage: ghcr.io/example/savestate@sha256:...

vm:
  # QEMU CPU model for every guest (required). `host` gives guests the node's own
  # CPU: the simple choice where all VM nodes are one machine type, as checkpoints
  # then restore only on nodes with an identical CPU. A named model every VM node
  # can run (e.g. EPYC-Rome-v4, run with `enforce` and checked by the node agent at
  # start-up) lets checkpoints move between any VM nodes.
  cpuModel: host

  # Added to each sandbox's memory for its pod's memory request, to cover QEMU.
  # memoryOverhead: 512Mi

  # CPU a VM pod requests per vCPU, for shapes without their own cpuRequest; more
  # than 0, at most 1. At 1 the pod's CPU limit equals its request (Guaranteed);
  # below 1 it has no CPU limit (Burstable; see "CPU requests below the vCPU count"
  # in docs/design.md). Memory is always request = limit.
  # cpuRequestPerVcpu: 1

  # Shapes a sandbox from an image may use. Default: [] (any shape). cpuRequest
  # (more than 0, at most vcpus) is the CPU a sandbox of the shape requests.
  # Default: vcpus × cpuRequestPerVcpu. diskRequest (more than 0, at most disk) is
  # the node disk it requests as ephemeral-storage. Default: disk, so a node never
  # takes more VM disk than it has; less lets more VMs share a node, betting their
  # guests never fill their disks.
  shapes:
    - {vcpus: 2, memory: 4Gi, disk: 30Gi}
    - {vcpus: 4, memory: 8Gi, disk: 60Gi, cpuRequest: 3500m}

  # Where VM pods run. The node-agent DaemonSet in node.yaml must select the same
  # nodes. Default: any node.
  nodeSelector:
    savestate.dev/node: "true"
  # Required node affinity for VM pods, on top of nodeSelector: Kubernetes
  # nodeSelectorTerms, any one of which a node must match. Default: none.
  # nodeAffinity:
  #   nodeSelectorTerms:
  #     - matchExpressions:
  #         - {key: kubernetes.io/hostname, operator: In, values: [node-a, node-b]}
  # tolerations: []

  # VMs each node may run: the node agent advertises this many units of the
  # extended resource savestate.dev/vm, and every VM pod takes one. The default is
  # the kubelet's default pod limit, so CPU and memory decide placement.
  # slotsPerNode: 110

  # Write and read checkpoint memory files with O_DIRECT. Through the page cache
  # (the default) a save usually pauses the VM for less, and concurrent restores
  # share the cached file; measure on your nodes' disks before turning it on.
  # memoryFileDirectIo: false

network:
  # Cluster, node, link-local and private destinations guests may still reach;
  # the rest of those ranges is dropped. Default: [].
  # egressAllow: [10.0.0.53/32]
  # DNS servers for guests. Default: [] (the VM pod's own resolvers).
  # dns: [10.0.0.53]
  # Who may connect to the ports sandboxes expose (spec.ports): NetworkPolicy
  # sources (namespaceSelector, podSelector, ipBlock), at least one. Default: pods
  # in the sandbox's own namespace.
  # exposeFrom:
  #   - namespaceSelector:
  #       matchLabels: {kubernetes.io/metadata.name: ingress}
  #   - ipBlock: {cidr: 192.0.2.0/24}

images:
  # Registries sandbox images may come from. Default: [] (any).
  registries: [ghcr.io/example]
  # Docker config.json with registry credentials, mounted into the node agent.
  # Default: none (anonymous pulls).
  # auth: /etc/savestate/registry/config.json
  # Registries (host[:port]) reached over plain HTTP. Default: [] (HTTPS only).
  # plainHttp: [registry.example.internal:5000]
  # Sandbox images, by digest, every node agent pulls when it starts and keeps,
  # so the first sandbox from one on a new node does not wait for the pull.
  # Default: [].
  # prefetch: [ghcr.io/example/base@sha256:...]

# S3-compatible object stores checkpoints are exported to and restored from, by
# name. Each prefix belongs to this installation alone: garbage collection deletes
# whatever under it names none of its checkpoints. The Secret lives in the
# namespace of the controller and node agents (savestate-system) and holds
# accessKeyId and secretAccessKey (optionally sessionToken). Default: {} (none).
# stores:
#   archive:
#     endpoint: https://s3.example.com
#     bucket: example-checkpoints
#     region: example-region-1
#     prefix: savestate
#     credentialsSecret: savestate-store-archive

# Store every checkpoint is exported to once Ready (a checkpoint's spec.export
# overrides it). Default: none, only checkpoints with spec.export are exported.
# export: archive

# Local copies of exported checkpoints are a cache, dropped (oldest first, never
# one a sandbox on the node was restored from) while the state directory's
# filesystem has less than this percentage free.
# cache:
#   minFreePercent: 10

# Transfers (exports and imports) each node runs at a time; a free slot goes to
# an import, which a sandbox waits for, before an export. Each buffers up to
# 256 MiB in the node agent: raise its memory limit (node.yaml) with this.
# transfers:
#   perNode: 4

ttl:
  sandbox:
    max: 30d
  checkpoint:
    default: 7d
    max: 90d
