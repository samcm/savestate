apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: savestate-node
  namespace: savestate-system
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: savestate
      app.kubernetes.io/component: node
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: savestate
        app.kubernetes.io/component: node
    spec:
      serviceAccountName: savestate-node
      # Critical, so the kubelet still admits the node agent on a node under disk
      # pressure (where it frees what stopped VMs left) and evicts it last.
      priorityClassName: system-node-critical
      # The nodes that run VMs: the same selection as `vm.nodeSelector` (and
      # `vm.nodeAffinity` and `vm.tolerations`) in config.yaml.
      nodeSelector:
        savestate.dev/node: "true"
      # The startup taint an installation may give new VM nodes (deploy/README.md,
      # "Running on an autoscaled cluster"); the node agent removes it.
      tolerations:
        - key: startup-taint.cluster-autoscaler.kubernetes.io/savestate
          operator: Exists
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      # Checks that this node runs the guest CPU model (`vm.cpuModel`) under
      # `enforce`, as every VM does; it needs /dev/kvm, hence privileged, and only for
      # this one QEMU start. A node that cannot run the model shows the missing
      # features as this container's termination message, and runs no node agent.
      initContainers:
        # Loads vhost_vsock, the guest agents' channel, where /dev/vhost-vsock is
        # missing; it needs the host's kernel modules, hence privileged. A privileged
        # container sees the host's device nodes.
        - name: load-modules
          image: ghcr.io/samcm/savestate
          command: [sh, -c, "test -c /dev/vhost-vsock || modprobe vhost_vsock"]
          terminationMessagePolicy: FallbackToLogsOnError
          securityContext:
            privileged: true
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: modules
              mountPath: /lib/modules
              readOnly: true
        - name: probe-cpu
          image: ghcr.io/samcm/savestate
          args: [node, --probe-cpu, --config, /etc/savestate/config.yaml]
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          securityContext:
            privileged: true
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: config
              mountPath: /etc/savestate
              readOnly: true
      containers:
        - name: node
          image: ghcr.io/samcm/savestate
          args: [node, --config, /etc/savestate/config.yaml]
          ports:
            - name: metrics
              containerPort: 9090
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            # Where the object stores' credential Secrets are.
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            # Up to 256 MiB per transfer (transfers.perNode, default 4).
            limits:
              memory: 2Gi
          # Root without privilege: it owns the state directory and hands files to
          # the VM pods' non-root QEMU, serves the kubelet a device plugin and
          # installs the VM pods' seccomp profile.
          securityContext:
            runAsUser: 0
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
              add: [CHOWN, DAC_OVERRIDE, FOWNER]
          volumeMounts:
            - name: config
              mountPath: /etc/savestate
              readOnly: true
            - name: state
              mountPath: /var/lib/savestate
            # Launcher sockets: /run/savestate/<namespace>/<sandbox>/<sandbox UID>/.
            - name: run
              mountPath: /run/savestate
            # The kubelet's device-plugin and seccomp directories, under `kubeletDir`
            # in config.yaml.
            - name: device-plugins
              mountPath: /var/lib/kubelet/device-plugins
            - name: seccomp
              mountPath: /var/lib/kubelet/seccomp
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: modules
          hostPath:
            path: /lib/modules
            type: Directory
        - name: config
          configMap:
            name: savestate-config
        # Must match `stateDir` in config.yaml.
        - name: state
          hostPath:
            path: /var/lib/savestate
            type: DirectoryOrCreate
        - name: run
          hostPath:
            path: /run/savestate
            type: DirectoryOrCreate
        # Must be `kubeletDir` (default /var/lib/kubelet) from config.yaml, here and
        # in the mount paths above.
        - name: device-plugins
          hostPath:
            path: /var/lib/kubelet/device-plugins
            type: Directory
        - name: seccomp
          hostPath:
            path: /var/lib/kubelet/seccomp
            type: DirectoryOrCreate
        - name: tmp
          emptyDir: {}
