apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: savestate-node
  namespace: savestate-system
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: savestate
      app.kubernetes.io/component: node
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: savestate
        app.kubernetes.io/component: node
    spec:
      serviceAccountName: savestate-node
      # The nodes that run VMs: the same selection as `vm.nodeSelector` (and
      # `vm.tolerations`) in config.yaml.
      nodeSelector:
        savestate.dev/node: "true"
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: node
          image: ghcr.io/samcm/savestate
          args: [node, --config, /etc/savestate/config.yaml]
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 1Gi
          # Root without privilege: it owns the state directory and hands files to
          # the VM pods' non-root QEMU.
          securityContext:
            runAsUser: 0
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
              add: [CHOWN, DAC_OVERRIDE, FOWNER]
          volumeMounts:
            - name: config
              mountPath: /etc/savestate
              readOnly: true
            - name: state
              mountPath: /var/lib/savestate
            # Launcher sockets: /run/savestate/<namespace>/<sandbox>/<sandbox UID>/.
            - name: run
              mountPath: /run/savestate
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: savestate-config
        # Must match `stateDir` in config.yaml.
        - name: state
          hostPath:
            path: /var/lib/savestate
            type: DirectoryOrCreate
        - name: run
          hostPath:
            path: /run/savestate
            type: DirectoryOrCreate
        - name: tmp
          emptyDir: {}
