# One sandbox namespace, `sandboxes`. Repeat this file for each namespace listed
# in the installation config's `namespaces`.
#
# VM pods are not privileged: their devices come from the node agent's device plugin
# and the runtime confines them with savestate's seccomp profile. They still need
# NET_ADMIN inside their own network namespace for the tap device and nftables, and
# hostPath volumes for the state directory and their run directory; the baseline Pod
# Security level forbids both, so this is the privileged level. Keep sandbox
# namespaces for sandboxes only and give people the savestate-user role there, never
# pod creation. The controller builds every VM pod with no service-account token,
# QEMU as non-root with its seccomp sandbox on, and a memory request equal to its limit.
apiVersion: v1
kind: Namespace
metadata:
  name: sandboxes
  labels:
    pod-security.kubernetes.io/enforce: privileged
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: savestate-controller
  namespace: sandboxes
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: savestate-controller
subjects:
  - kind: ServiceAccount
    name: savestate-controller
    namespace: savestate-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: savestate-node
  namespace: sandboxes
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: savestate-node
subjects:
  - kind: ServiceAccount
    name: savestate-node
    namespace: savestate-system
---
# Nothing connects to a VM pod over the network: exec, file copy and port-forward
# go through the kubelet, and the node agent drives the launcher over a unix
# socket. A sandbox that exposes ports (spec.ports) gets a NetworkPolicy of its own
# from the controller, which adds ingress on exactly those ports from
# network.exposeFrom. Guest egress is filtered by nftables inside the pod.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: savestate-vm-no-ingress
  namespace: sandboxes
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: vm
  policyTypes: [Ingress]
